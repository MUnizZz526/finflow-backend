server:
  port: 8080

spring:
  application:
    name: finflow-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/finflow_db
    username: finflow_user
    password: finflow_secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # NUNCA usar 'update' em projetos de nível de produção.
      # Usamos 'validate' para que o Flyway controle a evolução do schema.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

# Configurações de Segurança e JWT
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000 # 24 horas

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

